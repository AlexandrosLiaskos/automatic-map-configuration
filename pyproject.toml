[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "automatic-map-configuration"
version = "0.1.0"
description = "Automatic map configuration from attribute profiles: proposes the title, the field of the colours, the filters, the charts and the shown fields of a web map from the columns of a dataset."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Alexandros Liaskos" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["web mapping", "cartography", "data profiling", "thematic mapping", "GIS"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: GIS",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/AlexandrosLiaskos/automatic-map-configuration"
Issues = "https://github.com/AlexandrosLiaskos/automatic-map-configuration/issues"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/automatic_map_configuration"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
